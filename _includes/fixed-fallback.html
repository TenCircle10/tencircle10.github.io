    <!-- ============ X5 / XWeb 内核兜底：position:fixed 失效自愈 ==============
         腾讯系内置浏览器（QQ、微信）的 X5/XWeb 内核有一个经典 Bug：
         页面滚动时 position: fixed 会失效并降级成 absolute，元素被"冲走"，
         沉到整页最底部。

         CSS 侧已经做了三层加固（translate3d 3D 加速 + will-change 合成层 +
         html/body 清零 transform/filter），绝大多数情况下足以解决。
         但如果内核仍然降级了 fixed，纯 CSS 无法单方面把它拉回视口，
         这里再加一层「运行时自愈」作为最后一道保险：

         原理：滚动时检测按钮的视口坐标是否还在预期位置（视口底 - bottom）。
         一旦发现它被"冲走"了（坐标随页面滚动而漂移），就切换到
         position: absolute + transform: translate3d(x, y, 0) 的方案，
         用 JS 把它钉在视口上；尺寸只在 resize / load 时读，滚动帧不碰布局。

         关键点：正常设备上永远检测不到失效，因此这段代码完全不介入，
         不会影响桌面 Chrome / Safari / Edge 的原生行为。 -->
    <script>
      (function () {
        var BTN = [
          { id: "back-to-top", bottom: 20 },
          { id: "toc-mobile-btn", bottom: 80 }
        ];

        function collect() {
          var list = [];
          for (var i = 0; i < BTN.length; i++) {
            var el = document.getElementById(BTN[i].id);
            // w / h 先占位，真正的尺寸只在 measureAll() 里读一次
            if (el) list.push({ el: el, bottom: BTN[i].bottom, w: 0, h: 0 });
          }
          return list;
        }

        var items = collect();
        if (!items.length) return;

        // 视口与按钮尺寸全部缓存：只在初始化 / resize / load 时读一次。
        // 滚动帧里绝不读 offsetWidth / offsetHeight —— 那是强制同步布局的元凶。
        var viewport = { w: 0, h: 0 };

        function measureAll() {
          viewport.w = window.innerWidth || document.documentElement.clientWidth;
          viewport.h = window.innerHeight || document.documentElement.clientHeight;
          for (var i = 0; i < items.length; i++) {
            items[i].w = items[i].el.offsetWidth;
            items[i].h = items[i].el.offsetHeight;
          }
        }

        function isMobile() {
          return viewport.w <= 900;
        }

        var broken = false;   // 是否已确认 fixed 失效
        var ticking = false;

        // 检测阶段仍要读一次 rect，但一旦确认失效（broken=true）check() 会直接返回，
        // 之后每帧只读滚动值；且 check() 排在写入之前，读写不交错。
        function isDrifted(item) {
          var rect = item.el.getBoundingClientRect();
          if (!rect.height) return false;                       // 元素不可见，忽略
          var expected = viewport.h - item.bottom;
          return Math.abs(rect.bottom - expected) > 8;
        }

        // 自愈：改用 absolute + transform，把按钮钉在视口上
        function applyFallback(item) {
          var el = item.el;
          el.classList.add("is-fixed-fallback");
          // 切成 absolute 后尺寸可能变，补测一次（仅此一次）
          item.w = el.offsetWidth;
          item.h = el.offsetHeight;
          updateFallback(item);
        }

        function updateFallback(item) {
          var el = item.el;
          if (!el.classList.contains("is-fixed-fallback")) return;
          // 元素锚在文档 (0,0)（见 notes.css），把「视口右下角」换算成
          // 文档坐标后交给 transform。transform 走合成层，不触发重排；
          // 这里每帧读的只有滚动偏移，它不参与布局计算。
          var scrollX = window.pageXOffset || 0;
          var scrollY = window.pageYOffset || 0;
          var x = scrollX + viewport.w - 20 - item.w;
          var y = scrollY + viewport.h - item.bottom - item.h;
          el.style.transform = "translate3d(" + x + "px," + y + "px,0)";
        }

        function updateAll() {
          for (var i = 0; i < items.length; i++) {
            if (broken) updateFallback(items[i]);
          }
        }

        function check() {
          if (broken || !isMobile()) return;

          // 至少要滚动过一段距离才做判断，避免首屏误判
          if (window.pageYOffset < 50) return;

          for (var i = 0; i < items.length; i++) {
            if (isDrifted(items[i])) {
              // 确认失效：对所有按钮启用兜底
              broken = true;
              for (var j = 0; j < items.length; j++) applyFallback(items[j]);
              document.documentElement.classList.add("has-fixed-fallback");
              return;
            }
          }
        }

        function onScroll() {
          if (ticking) return;
          ticking = true;
          window.requestAnimationFrame(function () {
            ticking = false;
            check();
            updateAll();
          });
        }

        measureAll();
        window.addEventListener("scroll", onScroll, { passive: true });
        window.addEventListener("resize", function () {
          if (ticking) return;
          ticking = true;
          window.requestAnimationFrame(function () {
            ticking = false;
            measureAll();   // 尺寸只在 resize 时重读
            updateAll();
          });
        }, { passive: true });

        // 字体 / 图片加载完可能改变按钮尺寸，重测一次再钉
        window.addEventListener("load", function () {
          measureAll();
          updateAll();
        });
      })();
    </script>
