<!-- 日夜切换开关（From Uiverse.io by mamyapro123，纯 CSS + 原生 JS，无 Tailwind） -->
<!-- 日夜切换开关（From Uiverse.io by mamyapro123）
     摆放由外层容器决定：主页 .page-topbar（随滚动）/ 笔记页 .note-topbar（固定右上角），
     样式全部在 assets/css/publications.css 的 .theme-switch 区块里，
     该文件带 ?v= 时间戳版本号，不受 CDN 缓存影响。 -->

<label class="theme-switch" title="切换深色 / 浅色主题">
  <input
    type="checkbox"
    id="theme-switch-input"
    class="theme-switch__checkbox"
    aria-label="切换深色 / 浅色主题"
  />
  <div class="theme-switch__container">
    <!-- 夜空星星簇（只在暗色时显示） -->
    <div class="theme-switch__stars-cluster">
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
      <span class="star"></span>
    </div>

    <!-- 星星带（暗色时从顶部滑入） -->
    <div class="theme-switch__stars-container"></div>

    <!-- 云朵 -->
    <div class="theme-switch__clouds"></div>

    <!-- 太阳 / 月亮圆盘 -->
    <div class="theme-switch__circle-container">
      <div class="theme-switch__sun-moon-container">
        <div class="theme-switch__moon">
          <div class="theme-switch__spot"></div>
          <div class="theme-switch__spot"></div>
          <div class="theme-switch__spot"></div>
        </div>
      </div>
    </div>

    <!-- 极光 -->
    <div class="theme-switch__aurora"></div>

    <!-- 彗星 -->
    <div class="theme-switch__comets">
      <span class="comet"></span>
      <span class="comet"></span>
    </div>

    <!-- 流星 / 陨石 -->
    <span class="theme-switch__shooting-star"></span>
    <span class="theme-switch__shooting-star-2"></span>
    <span class="theme-switch__meteor"></span>
  </div>
</label>

<!-- 手绘质感滤镜：CSS 里的 filter: url(#sketchy) / url(#sketchy-sm) 依赖这两个定义 -->
<svg class="theme-switch__filters" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <filter id="sketchy" x="-10%" y="-10%" width="120%" height="120%">
      <feTurbulence type="fractalNoise" baseFrequency="0.02" numOctaves="3" seed="7" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.6" xChannelSelector="R" yChannelSelector="G" />
    </filter>
    <filter id="sketchy-sm" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.06" numOctaves="2" seed="3" result="noise" />
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="1.1" xChannelSelector="R" yChannelSelector="G" />
    </filter>
  </defs>
</svg>

<script>
  (function () {
    var input = document.getElementById("theme-switch-input");
    if (!input) return;

    function systemTheme() {
      return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches
        ? "dark"
        : "light";
    }

    function currentTheme() {
      var attr = document.documentElement.getAttribute("data-theme");
      return attr === "dark" || attr === "light" ? attr : systemTheme();
    }

    function applyTheme(theme) {
      document.documentElement.setAttribute("data-theme", theme);
      try {
        localStorage.setItem("theme", theme);
      } catch (error) {
        /* 存不进去也不影响本次切换 */
      }
      // 同步 Giscus 评论框（它在跨域 iframe 里，只能靠 postMessage）
      if (typeof window.updateGiscusTheme === "function") {
        window.updateGiscusTheme(theme);
      }
    }

    // 让开关的初始位置和当前实际主题一致
    input.checked = currentTheme() === "dark";

    input.addEventListener("change", function () {
      applyTheme(input.checked ? "dark" : "light");
    });
  })();
</script>
