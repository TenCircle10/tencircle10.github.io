<!-- ================= 数学公式渲染配置 (MathJax) ================= -->
<script>
  MathJax = {
    tex: {
      inlineMath: [['$', '$'], ['\\(', '\\)']],
      displayMath: [['$$', '$$'], ['\\[', '\\]']],
      processEscapes: true
    },
    options: {
      skipHtmlTags: ['script', 'noscript', 'style', 'textarea', 'pre', 'code'],
      // mermaid 图表的源码躺在 <div class="mermaid"> 里，要等 mermaid.js 去解析。
      // 如果 MathJax 先把里面的 $...$ 换成 mjx-container，图表源码就被改坏了，
      // 画出来是一堆乱码。这个类让 MathJax 整棵子树跳过。
      ignoreHtmlClass: 'mermaid'
    }
  };
</script>
<script id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
