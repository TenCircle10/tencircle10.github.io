remote_theme: yaoyao-liu/minimal-light@2.0

# Math Support
markdown: kramdown
kramdown:
  # 显式关闭 kramdown 自带的数学处理（null）。
  # 原因：kramdown 2.x 的 math_engine: mathjax 会把 $$...$$ 转成 MathJax 2 的
  # <script type="math/tex"> 标签，而本站用的是 MathJax 3，不认识这个标签 ——
  # 结果块级公式要么原样显示成 $$...$$ 文本，要么被吞成空白。
  # 关掉之后 $$...$$ 原样保留在 HTML 里，由 MathJax 3 在浏览器端处理（displayMath）。
  # 行内 $...$ 本来就不受 kramdown 影响，所以一直是好的。
  math_engine: ~
  input: GFM
  hard_wrap: false
  # 注意：不要开 parse_block_html。
  # 它会让所有 HTML 块内部都按 Markdown 解析，结果是 <details> 里的 <summary>、
  # </div>、</details> 被当成普通文本输出 —— 标签直接暴露、details 无法闭合，
  # 后面的 callout 会全部被吞进前一个 details（表现为"左侧边框一级套一级"）。
  # 真正需要解析 Markdown 的只有 <div class="callout-content" markdown="block">，
  # 那个 markdown 属性是独立机制，不需要 parse_block_html 也能生效。
  
# The following files will be removed from the generated website.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - README_zh_Hans.md
  - README_zh_Hant.md
  - README_de.md
  - LICENSE
  - minimal-light.gemspec
  - html_source_file/
  - sync_notes.py
  - deploy.ps1
  - "发布博客.bat"
  - .gitignore
  - origin/
  - TECH_GUIDE.md
  - callout-for-web.md
  - assets/css/obsidian-callouts.css.bak
